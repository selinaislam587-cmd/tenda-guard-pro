<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Sign in - Tenda Guard Pro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='boot.js') }}"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand">
      <span class="brand-mark">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8.3-8 9-4.8-.7-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      </span>
      <div class="brand-text">
        <h1>Tenda Guard Pro</h1>
        <span class="brand-sub">Sign in to manage your router</span>
      </div>
    </div>
    <form method="post" action="{{ url_for('login') }}" class="login-form">
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" autofocus required>
      </label>
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <button class="btn btn-filled" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
